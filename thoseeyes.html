<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Música - Those Eyes</title>
    <style>
        body {
            background-color: #0e0c0f; /* Mesma cor do seu index.html */
            color: #f0eaf4;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #9a8fa3;
            font-style: italic;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        .video-container {
            width: 90%;
            max-width: 560px;
            aspect-ratio: 16 / 9;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(192, 132, 176, 0.18);
            border-radius: 8px;
        }
        .btn-voltar {
            margin-top: 30px;
            text-decoration: none;
            color: #9a8fa3;
            border: 1px solid rgba(192, 132, 176, 0.18);
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-voltar:hover {
            color: #c084b0;
            border-color: #c084b0;
        }
    </style>
</head>
<body>

    <h1>Those Eyes</h1>
    <p>Toda vez que ouço essa música, é você quem me vem ao pensamento...</p>

    <div class="video-container">
        <!-- Link corrigido para evitar o erro de vídeo indisponível -->
        <iframe src="https://www.youtube.com/embed/6AS6p9jG0Hk" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
        </iframe>
    </div>

    <a href="index.html" class="btn-voltar">← Voltar</a>

</body>
